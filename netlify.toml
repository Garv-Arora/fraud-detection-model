# Netlify Configuration for Universal Sompo AI Claim Evidence Finder
# https://docs.netlify.com/configure-builds/file-based-configuration/
#
# `base` is the frontend directory, so every path below is relative to it.

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Serverless multi-engine search. Without this the deployed SPA has no way to
# reach Google News / Bing / DuckDuckGo (browser CORS blocks all three), and
# every production search silently degrades to manual-links-only mode.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API routes must be matched before the SPA catch-all below.
[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200
  force = true

# SPA fallback routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The pdf.js worker is content-hashed by Vite and safe to cache aggressively.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
