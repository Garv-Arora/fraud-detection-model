# Netlify configuration used when the site's base directory is `frontend`.
# Kept in sync with the repository-root netlify.toml.

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Serverless multi-engine search (Google News RSS, Bing News RSS, DuckDuckGo).
# The browser cannot call those endpoints directly because of CORS, so this
# function is what makes live search work on the deployed site.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API routes must be matched before the SPA catch-all below.
[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
